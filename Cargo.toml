[package]
name = "s3"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
bytes = "1"
hickory-resolver = ">=0.26, <1.0.0"
http = ">=1.5, <2.0.0"
http-body-util = "0.1"
hyper = { version = ">=1.11, <2.0.0", default-features = false, features = [
    "client",
    "http1",
    "http2",
] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = ">=0.23, <1.0.0", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
surrealism = "0.5.0"
surrealdb-types = "3.2.4"
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "net",
    "rt",
    "sync",
] }
tokio-rustls = { version = ">=0.26, <1.0.0", default-features = false }
tokio-util = { version = "0.7", features = ["io-util"] }
webpki-roots = "1"
