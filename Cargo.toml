[package]
name = "surreal-s3"
version = "0.1.0"
edition = "2024"
authors = ["Yuuna Paulina Jahn <mail@yuuna.dev>"]
license = "BSD-3-Clause"
repository = "https://github.com/yuunalein/surreal-s3"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = [
    "rt-tokio",
], default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
chrono = "0.4"
surrealism = "0.7.1"
surrealdb-types = "4.0.1"
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "net",
    "rt",
    "sync",
    "time",
] }
